<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#b98a94" />
<title>VK2 Urlaubsboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --creme: #f6f1ea; --creme-2: #efe7db; --taupe: #b8a894; --taupe-d: #8f8071;
    --berry: #a86b7e; --berry-l: #d9b8c1; --berry-bg: #f3e3e8;
    --ink: #4a4038; --muted: #9a8d7f; --line: #e4d9ca; --white: #ffffff;
    --ferien: #e7d3a1; --ferien-d: #c9ac6b; --weekend: #f0ebe3; --today: #a86b7e;
    --kw-a: #f6f1ea; --kw-b: #ece3ef;
    --radius: 16px; --radius-sm: 10px;
    --shadow: 0 2px 10px rgba(120,100,90,0.10); --shadow-lg: 0 6px 22px rgba(120,100,90,0.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
  body { font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink); background: var(--white); padding: 14px; font-weight: 500; }
  .wrap { max-width: 1220px; margin: 0 auto; }
  h1 { font-family: 'Caveat', cursive; font-size: 40px; margin: 0; display: flex; align-items: center; gap: 12px; color: var(--berry); font-weight: 700; }
  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .vk2badge { background: var(--berry); color: #fff; font-size: 15px; padding: 6px 14px; font-weight: 700; letter-spacing: 2px; border-radius: 999px; box-shadow: var(--shadow); }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { flex: 1; min-width: 120px; padding: 12px 14px; border: none; background: var(--creme); color: var(--taupe-d); font-weight: 600; cursor: pointer; font-size: 15px; border-radius: var(--radius); box-shadow: var(--shadow); font-family: 'Quicksand'; }
  .tab.active { background: var(--berry); color: #fff; }
  .card { background: var(--white); border: 1.5px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .btn { border: none; padding: 11px 18px; font-weight: 600; cursor: pointer; font-size: 15px; background: var(--berry); color: #fff; border-radius: var(--radius-sm); font-family: 'Quicksand'; box-shadow: var(--shadow); }
  .btn.taupe { background: var(--taupe); }
  .btn.ghost { background: var(--creme); color: var(--ink); }
  .btn.sm { padding: 8px 13px; font-size: 14px; }
  .btn.red-ghost { background: var(--berry-bg); color: var(--berry); padding: 8px 13px; font-size: 14px; }
  input, select { font-size: 16px; padding: 10px 13px; border: 1.5px solid var(--line); background: var(--white); outline: none; border-radius: var(--radius-sm); font-family: 'Quicksand'; color: var(--ink); }
  input:focus, select:focus { border-color: var(--berry); }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .yearnav { display: flex; align-items: center; gap: 6px; background: var(--creme); border-radius: var(--radius); padding: 5px; box-shadow: var(--shadow); }
  .yearnav button { border: none; background: transparent; width: 38px; height: 38px; cursor: pointer; font-size: 22px; color: var(--berry); border-radius: var(--radius-sm); }
  .yearnav .yr { font-weight: 700; min-width: 54px; text-align: center; font-size: 17px; }
  .viewtoggle { display: flex; gap: 5px; background: var(--creme); border-radius: var(--radius); padding: 5px; box-shadow: var(--shadow); }
  .viewtoggle button { border: none; background: transparent; padding: 9px 15px; font-size: 14px; font-weight: 600; color: var(--taupe-d); cursor: pointer; border-radius: var(--radius-sm); font-family: 'Quicksand'; }
  .viewtoggle button.active { background: var(--berry); color: #fff; }
  .legend { background: var(--creme); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .legend .items { display: flex; gap: 14px 26px; align-items: center; font-size: 13px; flex-wrap: wrap; font-weight: 600; line-height: 1.5; color: var(--taupe-d); }
  .legend .items span.li { display: inline-flex; align-items: center; gap: 8px; }
  .chip { width: 20px; height: 20px; display: inline-block; flex-shrink: 0; border-radius: 6px; }
  .personbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .personbar label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .personbar select { flex: 1; min-width: 200px; }
  .cnt { font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 999px; }
  .monthgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(356px, 1fr)); gap: 20px; padding: 20px; justify-items: center; }
  .month { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px; background: var(--white); box-shadow: var(--shadow); width: 356px; max-width: 100%; overflow: hidden; }
  .month h4 { font-family: 'Caveat', cursive; font-size: 26px; margin: 0 0 12px; text-align: center; color: var(--berry); font-weight: 700; }
  .monthgriddays { display: grid; grid-template-columns: repeat(8, 36px); gap: 4px; justify-content: center; }
  .dowhead { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; display: flex; align-items: center; justify-content: center; height: 20px; width: 36px; }
  .dowhead.kwhead { font-size: 10px; color: var(--taupe); }
  .cellbox { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 13px; position: relative; border-radius: 9px; font-weight: 600; border: 1.5px solid transparent; }
  .kwcell { color: var(--taupe-d); font-size: 11px; font-weight: 700; border: 1.5px solid var(--line); }
  .kwcell.empty { border: 1.5px solid transparent; background: transparent !important; }
  .day { cursor: pointer; user-select: none; border: 1.5px solid var(--line); background: var(--white); }
  .day.empty { border: 1.5px solid transparent; cursor: default; background: transparent; }
  .day .rep { position: absolute; top: 2px; right: 3px; font-size: 9px; font-weight: 800; line-height: 1; }
  .sprinkle { position: absolute; inset: -3px; border-radius: 13px; pointer-events: none; z-index: 3; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius); }
  table.cal { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; }
  table.cal th, table.cal td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; padding: 0; }
  table.cal thead th { background: var(--creme); padding: 8px 6px; font-weight: 700; color: var(--taupe-d); font-size: 12px; }
  table.cal th.nameh { position: sticky; left: 0; z-index: 3; background: var(--creme); text-align: left; padding: 10px 12px; min-width: 170px; font-size: 13px; }
  table.cal td.name { position: sticky; left: 0; z-index: 2; text-align: left; padding: 9px 12px; font-size: 13px; font-weight: 700; min-width: 170px; white-space: nowrap; background: var(--white); }
  table.cal td.name small { display: block; font-size: 10px; color: var(--muted); font-weight: 600; }
  table.cal td.ucell { position: sticky; left: 170px; z-index: 2; text-align: center; font-size: 13px; font-weight: 700; min-width: 66px; background: var(--white); }
  table.cal th.uhead { position: sticky; left: 170px; z-index: 3; background: var(--creme); font-size: 12px; min-width: 66px; padding: 8px 6px; }
  .kwcolcell { min-width: 40px; height: 38px; cursor: pointer; font-weight: 700; font-size: 12px; }
  .emprow { display: flex; align-items: center; gap: 9px; padding: 13px 12px; flex-wrap: wrap; border-bottom: 1.5px solid var(--line); }
  .emprow:last-child { border-bottom: none; }
  .emprow .nm { font-weight: 700; min-width: 130px; font-size: 15px; }
  .badge { font-size: 11px; padding: 3px 10px; font-weight: 700; border-radius: 999px; }
  .badge.me { background: var(--berry); color: #fff; letter-spacing: 0.5px; }
  .badge.fach { color: #fff; }
  .badge.soft { background: var(--creme-2); color: var(--taupe-d); }
  .badge.berry { background: var(--berry-bg); color: var(--berry); }
  .badge.sage { background: #dde6d8; color: #5f7256; }
  .spacer { flex: 1; }
  .bdaygrid { display: grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap: 12px; padding: 18px; }
  .bcard { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 15px; display: flex; align-items: center; gap: 13px; background: var(--white); box-shadow: var(--shadow); }
  .bcard.soon { border: 2.5px solid var(--berry); background: var(--berry-bg); }
  .bcard .cake { font-size: 28px; }
  .bcard .bn { font-weight: 700; }
  .bcard .bd { color: var(--muted); font-size: 13px; }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.6; }
  .empty { color: var(--muted); padding: 28px; text-align: center; line-height: 1.7; }
  .modal-bg { position: fixed; inset: 0; background: rgba(74,64,56,0.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: var(--white); padding: 24px; width: 100%; max-width: 420px; max-height: 92vh; overflow-y: auto; border-radius: var(--radius); box-shadow: var(--shadow-lg); }
  .modal h3 { margin: 0 0 16px; font-family: 'Caveat'; font-size: 30px; color: var(--berry); }
  .modal .fields { display: flex; flex-direction: column; gap: 13px; margin-bottom: 20px; }
  .modal label.lbl { font-size: 12px; color: var(--muted); font-weight: 700; display: block; margin-bottom: 6px; }
  .modal .actions { display: flex; gap: 9px; justify-content: flex-end; }
  .modal .chk { display: flex; align-items: center; gap: 11px; cursor: pointer; padding: 11px 13px; border: 1.5px solid var(--line); background: var(--white); border-radius: var(--radius-sm); }
  .modal .chk.on { background: var(--berry-bg); border-color: var(--berry-l); }
  .modal .chk input { width: 19px; height: 19px; accent-color: var(--berry); }
  .modal input[type=text], .modal input[type=date], .modal select { width: 100%; }
  .counter { display: flex; align-items: center; justify-content: space-between; padding: 10px 13px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); gap: 10px; }
  .counter .clabel { font-size: 14px; font-weight: 600; }
  .counter .cctrl { display: flex; align-items: center; gap: 8px; }
  .counter .cbtn { width: 32px; height: 32px; border: none; border-radius: 8px; background: var(--creme-2); color: var(--berry); font-size: 18px; font-weight: 700; cursor: pointer; line-height: 1; }
  .counter .cnum { width: 46px; text-align: center; font-size: 15px; padding: 6px; }
  .exportbox, .syncbox { margin-top: 22px; border-top: 1.5px solid var(--line); padding-top: 18px; }
  .exportbox h3, .syncbox h3 { font-family: 'Caveat'; font-size: 26px; color: var(--berry); margin: 0 0 6px; }
  .exportrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .syncstate { font-size: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 700; }
  .syncstate.on { background: #dde6d8; color: #5f7256; }
  .syncstate.off { background: var(--creme-2); color: var(--muted); }
  .syncfields { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; max-width: 460px; }
  @media (max-width: 640px) {
    h1 { font-size: 32px; }
    body { padding: 10px; }
    .monthgrid { grid-template-columns: 1fr; padding: 12px; gap: 14px; }
    .month { width: 100%; padding: 12px; }
    .monthgriddays { grid-template-columns: repeat(8, 1fr); gap: 3px; }
    .cellbox { width: auto; height: 34px; font-size: 12px; }
    .dowhead { width: auto; }
  }
</style>
</head>

<script>
"use strict";
/* ====================== DATEN ====================== */
var MONTHS = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
var MONTHS_FULL = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
var WD = ["S","M","D","M","D","F","S"];
var WD_MON = ["Mo","Di","Mi","Do","Fr","Sa","So"];
var URLAUBS_LIMIT = 30;
function limitFor(emp){ return URLAUBS_LIMIT + (emp && emp.behinderung && emp.zusatzurlaub>0 ? emp.zusatzurlaub : 0); }

var FACHBEREICHE = ["Elektro","Eisenwaren","Sanitär"];

  ink:"#4a4038", weekend:"#f0ebe3", ferien:"#e7d3a1", ferienD:"#c9ac6b",
  vorjahr:"#efe7db", vorjahrLine:"#b8a894", over:"#a86b7e", overBg:"#f3e3e8",
  taupe:"#b8a894", creme:"#f6f1ea", kwA:"#f6f1ea", kwB:"#ece3ef", line:"#e4d9ca",
  today:"#a86b7e", muted:"#9a8d7f"

var FERIEN = {
  2025: [{start:"2025-01-01",end:"2025-01-11"},{start:"2025-04-07",end:"2025-04-21"},{start:"2025-07-07",end:"2025-08-15"},{start:"2025-10-06",end:"2025-10-18"},{start:"2025-12-22",end:"2025-12-31"}],
  2026: [{start:"2026-01-01",end:"2026-01-10"},{start:"2026-03-30",end:"2026-04-10"},{start:"2026-06-29",end:"2026-08-07"},{start:"2026-10-05",end:"2026-10-17"},{start:"2026-12-23",end:"2026-12-31"}],

var FEIERTAGE = {

  2026: {"2026-01-01":"Neujahr","2026-04-03":"Karfreitag","2026-04-06":"Ostermontag","2026-05-01":"Tag der Arbeit","2026-05-14":"Christi Himmelfahrt","2026-05-25":"Pfingstmontag","2026-06-04":"Fronleichnam","2026-10-03":"Tag der Deutschen Einheit","2026-12-25":"1. Weihnachtsfeiertag","2026-12-26":"2. Weihnachtsfeiertag"},
  2027: {"2027-01-01":"Neujahr","2027-03-26":"Karfreitag","2027-03-29":"Ostermontag","2027-05-01":"Tag der Arbeit","2027-05-06":"Christi Himmelfahrt","2027-05-17":"Pfingstmontag","2027-05-27":"Fronleichnam","2027-10-03":"Tag der Deutschen Einheit","2027-12-25":"1. Weihnachtsfeiertag","2027-12-26":"2. Weihnachtsfeiertag"}
};

function mk(id,name,opts){
  var e={id:id,name:name,me:false,birthday:"",urlaub:[],azubi:false,teilzeit:false,vollzeit:false,fach:"",kinder:0,pflege:0,betriebsrat:0,schicht:"",behinderung:false,zusatzurlaub:0};
  for(var k in opts) e[k]=opts[k];
  return e;
}
var DEFAULT_SCHICHTEN = ["Schicht 1","Schicht 2"];
function getSchichten(){
  if(STATE.data && Array.isArray(STATE.data.schichten)) return STATE.data.schichten;
  return DEFAULT_SCHICHTEN;
}
var DEFAULT_EMP = [
  { id:"me", name:"Jennifer Hebling (VK2-Leitung)", me:true, birthday:"", urlaub:[], azubi:false, teilzeit:false, vollzeit:true, fach:"", kinder:0, pflege:0, betriebsrat:0, schicht:"", behinderung:false, zusatzurlaub:0 },

  mk("e11","Lisa Freund",{vollzeit:true,fach:"Elektro",schicht:"Schicht 2"}),
  mk("e5","Irene Heilmann",{vollzeit:true,fach:"Sanitär",schicht:"Schicht 2"}),
  mk("e12","Stefan Lautenschläger",{vollzeit:true,fach:"Sanitär",schicht:"Schicht 2"}),

  mk("e8","Ralf Weigel",{vollzeit:true,fach:"Eisenwaren",schicht:"Schicht 2"}),
  mk("e4","Michael Gössl",{vollzeit:true,fach:"Sanitär",schicht:""})
];

/* ====================== HILFSFUNKTIONEN ====================== */
function pad(n){ return (n<10?"0":"")+n; }
function iso(y,m,d){ return y+"-"+pad(m+1)+"-"+pad(d); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function todayISO(){ var t=new Date(); return iso(t.getFullYear(),t.getMonth(),t.getDate()); }

/* ISO-Kalenderwoche für ein Datum */
function isoWeek(y,m,d){
  var date = new Date(Date.UTC(y,m,d));
  var day = (date.getUTCDay()+6)%7;      // Mo=0..So=6
  date.setUTCDate(date.getUTCDate()-day+3); // Donnerstag dieser Woche
  var firstThu = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  var fday = (firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate()-fday+3);
  var week = 1 + Math.round((date-firstThu)/(7*24*3600*1000));
  return week;
}
function isoWeekFromISO(ds){ var p=ds.split("-"); return isoWeek(+p[0],+p[1]-1,+p[2]); }

function ferienDaysSet(year){
  var set={}; var list=FERIEN[year]||[];
  for(var i=0;i<list.length;i++){
    var d=new Date(list[i].start), end=new Date(list[i].end);
    while(d<=end){ set[iso(d.getFullYear(),d.getMonth(),d.getDate())]=true; d.setDate(d.getDate()+1); }
  }
  return set;
}
function feiertagName(ds){ var y=parseInt(ds.slice(0,4),10); var f=FEIERTAGE[y]||{}; return f[ds]||null; }
function priorYearMMDD(emp,year){
  var set={}; var u=emp.urlaub||[];
  for(var i=0;i<u.length;i++){ var y=parseInt(u[i].slice(0,4),10); if(y<year) set[u[i].slice(5)]=true; }
  return set;
}
function fmtBday(b){
  var p=b.split("-");
  if(p.length===3) return parseInt(p[2],10)+". "+MONTHS_FULL[parseInt(p[1],10)-1];
  if(p.length===2) return parseInt(p[1],10)+". "+MONTHS_FULL[parseInt(p[0],10)-1];
  return b;
}
function bdayMMDD(b){
  if(!b) return null;
  var p=b.split("-");
  if(p.length===3) return p[1]+"-"+p[2];
  if(p.length===2) return p[0]+"-"+p[1];
  return null;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* ====================== SPEICHER: lokal + Cloud (JSONBin) ====================== */
var KEY = "vk2:data";
var CFGKEY = "vk2:sync";

function loadLocal(){ try{ var r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(STATE.data)); }catch(e){} }

function loadSyncCfg(){ try{ var r=localStorage.getItem(CFGKEY); if(r) return JSON.parse(r); }catch(e){} return { projectId:"", apiKey:"" }; }
function saveSyncCfg(cfg){ try{ localStorage.setItem(CFGKEY, JSON.stringify(cfg)); }catch(e){} }

var SYNC = loadSyncCfg();
var SYNC_STATUS = "off"; // off | ok | error | saving | loading
var pushTimer = null;
var DOCPATH = "vk2/board"; // Firestore-Collection/Dokument

function syncEnabled(){ return !!(SYNC.projectId && SYNC.apiKey); }
function fireUrl(){
  return "https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(SYNC.projectId)+
         "/databases/(default)/documents/"+DOCPATH+"?key="+encodeURIComponent(SYNC.apiKey);
}

/* Firestore speichert typisierte Felder. Wir legen die Board-Daten als JSON-String
   in ein einziges Feld "json", das ist am robustesten und einfachsten. */
function toFirestore(dataObj){
  return { fields: { json: { stringValue: JSON.stringify(dataObj) } } };
}
function fromFirestore(resp){
  try{
    if(resp && resp.fields && resp.fields.json && typeof resp.fields.json.stringValue==="string"){
      var obj = JSON.parse(resp.fields.json.stringValue);
      return (obj && obj.employees) ? obj : null;
    }
  }catch(e){}
  return null;
}

/* Von Cloud laden */
function cloudLoad(cb){
  if(!syncEnabled()){ cb(null); return; }
  SYNC_STATUS="loading";
  var xhr = new XMLHttpRequest();
  xhr.open("GET", fireUrl(), true);
  xhr.onload = function(){
    if(xhr.status>=200 && xhr.status<300){
      try{ var res=JSON.parse(xhr.responseText); SYNC_STATUS="ok"; cb(fromFirestore(res)); }
      catch(e){ SYNC_STATUS="error"; cb(null); }
    } else if(xhr.status===404){
      // Dokument existiert noch nicht -> als "leer, aber verbunden" behandeln
      SYNC_STATUS="ok"; cb(null);
    } else { SYNC_STATUS="error"; cb(null); }
    if(STATE.tab==="team") render();
  };
  xhr.onerror = function(){ SYNC_STATUS="error"; cb(null); if(STATE.tab==="team") render(); };
  xhr.send();
}
/* In Cloud speichern (entprellt) */
function cloudPushSoon(){
  if(!syncEnabled()) return;
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(cloudPushNow, 900);
}
function cloudPushNow(){
  if(!syncEnabled()) return;
  SYNC_STATUS="saving"; if(STATE.tab==="team") render();
  var xhr = new XMLHttpRequest();
  // PATCH legt das Dokument an oder überschreibt es (updateMask auf Feld "json")
  xhr.open("PATCH", fireUrl()+"&updateMask.fieldPaths=json", true);
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.onload = function(){
    SYNC_STATUS = (xhr.status>=200 && xhr.status<300) ? "ok" : "error";
    if(STATE.tab==="team") render();
  };
  xhr.onerror = function(){ SYNC_STATUS="error"; if(STATE.tab==="team") render(); };
  xhr.send(JSON.stringify(toFirestore(STATE.data)));
}

/* Zentrales Speichern: lokal sofort, Cloud entprellt */

var STATE = { data:null, tab:"plan", year:2026, view:"month", selPerson:"me" };

var LAYOUT_VERSION = 6;
function normalizeEmp(e){
  if(typeof e.kinder!=="number") e.kinder=0;
  if(typeof e.pflege!=="number") e.pflege = (e.pflege===true?1:(typeof e.pflege==="number"?e.pflege:0));
  if(typeof e.betriebsrat!=="number") e.betriebsrat=0;
  if(!("azubi" in e)) e.azubi=false;
  if(!("teilzeit" in e)) e.teilzeit=false;
  if(!("vollzeit" in e)) e.vollzeit=false;
  if(!("fach" in e)) e.fach="";
  if(!("schicht" in e)) e.schicht="";
  if(!("behinderung" in e)) e.behinderung=false;
  if(typeof e.zusatzurlaub!=="number") e.zusatzurlaub=0;
  if(!e.urlaub) e.urlaub=[];
  return e;
}
function applyData(d){
  for(var i=0;i<d.employees.length;i++) normalizeEmp(d.employees[i]);
  if(!Array.isArray(d.schichten)) d.schichten = DEFAULT_SCHICHTEN.slice();
  STATE.data=d;
}
function initData(){
  var d=loadLocal();
  if(!d){
    d={employees:DEFAULT_EMP.slice(),schichten:DEFAULT_SCHICHTEN.slice(),layout:LAYOUT_VERSION};
    applyData(d); saveLocal();
  } else {
    var hatPlatzhalter=false,i;
    for(i=0;i<d.employees.length;i++){
      if(/^Mitarbeiter \d+$/.test(d.employees[i].name)) hatPlatzhalter=true;
      if(d.employees[i].me && d.employees[i].name==="Ich (VK2-Leitung)") hatPlatzhalter=true;
    }
    if(hatPlatzhalter || (d.layout||0)<LAYOUT_VERSION){
      var neu=[];
      for(i=0;i<DEFAULT_EMP.length;i++){
        var def=DEFAULT_EMP[i],alt=null;
        for(var j=0;j<d.employees.length;j++){ if(d.employees[j].id===def.id){ alt=d.employees[j]; break; } }
        if(alt){ var c={}; for(var k in def) c[k]=def[k]; c.urlaub=alt.urlaub||[]; c.birthday=alt.birthday||""; if(typeof alt.kinder==="number")c.kinder=alt.kinder; if(typeof alt.betriebsrat==="number")c.betriebsrat=alt.betriebsrat; if(typeof alt.pflege==="number")c.pflege=alt.pflege; if(typeof alt.behinderung==="boolean")c.behinderung=alt.behinderung; if(typeof alt.zusatzurlaub==="number")c.zusatzurlaub=alt.zusatzurlaub; neu.push(c); }
        else neu.push(def);
      }
      d.employees=neu; d.layout=LAYOUT_VERSION;
      applyData(d); saveLocal();
    } else { applyData(d); }
  }
}
/* ====================== AKTIONEN ====================== */
function toggleDay(empId,ds){
  if(feiertagName(ds)) return;
  var emps=STATE.data.employees;
  for(var i=0;i<emps.length;i++){
    if(emps[i].id===empId){
      var idx=emps[i].urlaub.indexOf(ds);
      if(idx>=0) emps[i].urlaub.splice(idx,1); else emps[i].urlaub.push(ds);
      break;
    }
  }
  saveData(); render();
}
function zaehleUrlaub(emp,year){
  var n=0,u=emp.urlaub;
  for(var i=0;i<u.length;i++){
    var ds=u[i];
    if(ds.slice(0,4)!==String(year)) continue;
    var p=ds.split("-");
    var dow=new Date(+p[0],+p[1]-1,+p[2]).getDay();
    if(dow===0||dow===6) continue;
    if(feiertagName(ds)) continue;
    n++;
  }
  return n;
}

function sprinkleSvg(){
  // bunte Zuckerstreusel als SVG-Umrandung (dünne bunte Striche rund um die Zelle)
  var cols=["#e79cb0","#f2cf8a","#a7c8b0","#b39ddb","#efa98a","#8fc9d6"];
  var lines="";
  var n=22;
  for(var i=0;i<n;i++){
    var ang=(i/n)*2*Math.PI;
    var cx=20+16*Math.cos(ang), cy=20+16*Math.sin(ang);
    var rot=(ang*180/Math.PI)+ (i%2?35:-20);
    var col=cols[i%cols.length];
    lines+='<rect x="'+(cx-2.4)+'" y="'+(cy-0.9)+'" width="4.8" height="1.8" rx="0.9" fill="'+col+'" transform="rotate('+rot+' '+cx+' '+cy+')"/>';
  }
  return '<svg class="sprinkle" viewBox="0 0 40 40" preserveAspectRatio="none">'+lines+'</svg>';
}

function monthCardHtml(person,month,prior){
  var year=STATE.year;
  var ferSet=FERSETS[year]||(FERSETS[year]=ferienDaysSet(year));
  var today=TODAY;
  var dim=daysInMonth(year,month);
  var firstDow=(new Date(year,month,1).getDay()+6)%7;
  var bdayMap = bdayMMDD(person.birthday);

  var h='<div class="month"><h4>'+MONTHS_FULL[month]+'</h4>';
  h+='<div class="monthgriddays">';
  // Kopfzeile (8 Zellen: KW + Wochentage)
  h+='<div class="dowhead kwhead">KW</div>';
  for(var w=0;w<7;w++) h+='<div class="dowhead">'+WD_MON[w]+'</div>';

  // Tage in ein flaches Raster (führende Leerzellen + Tage + Auffüllen auf volle Wochen)
  var cells=[];
  for(var e=0;e<firstDow;e++) cells.push(null);
  for(var d=1;d<=dim;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  var numWeeks=cells.length/7;
  for(var wk=0;wk<numWeeks;wk++){
    // KW-Zelle links
    var kw="", kwColor="";
    for(var c=0;c<7;c++){ var dd=cells[wk*7+c]; if(dd!==null){ kw=isoWeek(year,month,dd); break; } }
    if(kw!==""){ kwColor=(kw%2===0)?COL.kwA:COL.kwB; }
    h+='<div class="cellbox kwcell'+(kw===""?" empty":"")+'" style="background:'+(kwColor||"transparent")+';">'+(kw!==""?kw:"")+'</div>';
    // 7 Tageszellen
    for(var cc=0;cc<7;cc++){
      var day=cells[wk*7+cc];
      if(day===null){ h+='<div class="cellbox day empty"></div>'; continue; }
      var ds=iso(year,month,day);
      var dow=new Date(year,month,day).getDay();
      var isWe=(dow===0||dow===6);
      var isFer=!!ferSet[ds];
      var ftName=feiertagName(ds);
      var isUrl=person.urlaub.indexOf(ds)>=0;
      var isRepeat=isUrl && !!prior[ds.slice(5)];
      var isTod=(ds===today);
      var isBday = bdayMap && (ds.slice(5)===bdayMap);

      var bg="#fff",color=COL.ink,fw="600";
      if(isWe){ bg=COL.weekend; color=COL.muted||"#9a8d7f"; }
      if(isFer){ bg=COL.ferien; color=COL.ink; }
      if(ftName){ bg="#4a4038"; color="#fff"; fw="700"; }
      if(isUrl){ bg=COL.berry; color="#fff"; fw="700"; }
      if(isRepeat){ bg=COL.vorjahr; color=COL.ink; fw="700"; }
      var style="background:"+bg+";color:"+color+";font-weight:"+fw+";";
      if(isTod) style+="border:3px solid "+COL.today+";";
      if(isRepeat) style+="box-shadow:inset 0 0 0 3px "+COL.vorjahrLine+";";
      if(isFer&&isUrl&&!isRepeat) style+="background-image:repeating-linear-gradient(45deg,"+COL.berry+","+COL.berry+" 6px,"+COL.ferien+" 6px,"+COL.ferien+" 12px);";
      var title=ftName?ftName:(isBday?"Geburtstag":(isRepeat?"Selber Tag wie im Vorjahr":""));
      h+='<div class="cellbox day" data-day="'+ds+'" data-person="'+person.id+'" style="'+style+'" title="'+esc(title)+'">'+day+(isRepeat?'<span class="rep" style="color:'+COL.taupe+';">↻</span>':'')+(isBday?sprinkleSvg():'')+'</div>';
    }
  }
  h+='</div>';
  return h;
}

/* ===== Team-Übersicht: Spalten = Kalenderwochen (nicht Tage) ===== */
function weeksOfYear(year){
  // Liste aller KW mit repräsentativem Datum (Montag) im Jahr
  var weeks=[]; var seen={};
  var d=new Date(year,0,1);
  var end=new Date(year,11,31);
  while(d<=end){
    var kw=isoWeek(d.getFullYear(),d.getMonth(),d.getDate());
    // KW dem Jahr zuordnen, in dem der Donnerstag liegt
    var tmp=new Date(d); var day=(tmp.getDay()+6)%7; tmp.setDate(tmp.getDate()-day+3);
    if(tmp.getFullYear()===year && !seen[kw]){
      seen[kw]=true;
      // Monat für Gruppierung: Monat des Donnerstags
      weeks.push({ kw:kw, month:tmp.getMonth() });
    }
    d.setDate(d.getDate()+7);
  }
  // sicherstellen, dass KW1..letzte sortiert
  weeks.sort(function(a,b){ return a.kw-b.kw; });
  return weeks;
}
function empHasUrlaubInWeek(emp,year,kw){
  var u=emp.urlaub;
  for(var i=0;i<u.length;i++){
    if(u[i].slice(0,4)!==String(year)) continue;
    if(isoWeekFromISO(u[i])===kw) return true;
  }
  return false;
}
/* enthält die KW (irgend)einen Ferientag in Hessen? */
function weekHasFerien(year,kw){
  var ferSet=FERSETS[year]||(FERSETS[year]=ferienDaysSet(year));
  for(var ds in ferSet){ if(ds.slice(0,4)===String(year) && isoWeekFromISO(ds)===kw) return true; }
  return false;
}
/* Mitarbeiter nach Schichten gruppieren, in gewünschter Reihenfolge */
function groupBySchicht(emps){
  var groups=[];
  var schichten=getSchichten();
  var leitung=[], azubis=[], byShift={}, ohne=[];
  schichten.forEach(function(s){ byShift[s]=[]; });
  for(var i=0;i<emps.length;i++){
    var e=emps[i];
    if(e.me) leitung.push(e);
    else if(e.azubi) azubis.push(e);
    else if(e.schicht && byShift[e.schicht]) byShift[e.schicht].push(e);
    else ohne.push(e);
  }
  if(leitung.length) groups.push({title:"Leitung", items:leitung});
  if(azubis.length) groups.push({title:"Auszubildende", items:azubis});
  schichten.forEach(function(s){ if(byShift[s].length) groups.push({title:s, items:byShift[s]}); });
  if(ohne.length) groups.push({title:"Ohne Schicht", items:ohne});
  return groups;
}
function tableHtml(){

  var proKW={};
  for(i=0;i<emps.length;i++){
    for(w=0;w<weeks.length;w++){
      if(empHasUrlaubInWeek(emps[i],year,weeks[w].kw)) proKW[weeks[w].kw]=(proKW[weeks[w].kw]||0)+1;

    for(var mi=0;mi<members.length;mi++){

      h+='<tr>';
      h+='<td class="name" style="'+nameStyle+'">'+esc(emp.name)+(emp.fach?'<small>'+emp.fach+(emp.behinderung&&emp.zusatzurlaub>0?' · +'+emp.zusatzurlaub+' Urlaub':'')+'</small>':(emp.behinderung&&emp.zusatzurlaub>0?'<small>+'+emp.zusatzurlaub+' Urlaub</small>':''))+'</td>';
      var uStyle= over?"background:"+COL.over+";color:#fff;":(tight?"background:"+COL.overBg+";color:"+COL.over+";":"");
      h+='<td class="ucell" style="'+uStyle+'" title="'+used+' von '+lim+' Tagen">'+used+'/'+lim+(over?' ⚠':'')+'</td>';
      for(w=0;w<weeks.length;w++){

        var hasU=empHasUrlaubInWeek(emp,year,kw);
        var isRepeat=false;
        if(hasU){
          for(var uu=0;uu<emp.urlaub.length;uu++){
            var dsx=emp.urlaub[uu];
            if(dsx.slice(0,4)===String(year) && isoWeekFromISO(dsx)===kw && prior[dsx.slice(5)]){ isRepeat=true; break; }
          }
        }
        var isOverlap=hasU && (proKW[kw]||0)>=2;
        var st="min-width:40px;background:"+kwBg+";";
        if(hasU){ st="min-width:40px;background:"+COL.berry+";"; }
        if(isRepeat && !isOverlap){ st="min-width:40px;background:"+COL.vorjahr+";box-shadow:inset 0 0 0 2px "+COL.vorjahrLine+";"; }
        if(isOverlap){ st="min-width:40px;background-image:repeating-linear-gradient(45deg,"+COL.berry+","+COL.berry+" 4px,#fff 4px,#fff 7px);"; }
        var tip=esc(emp.name)+" · KW "+kw;
        if(ferKW2) tip+=" · Ferien";
        if(hasU) tip+=" — Urlaub";
        if(isOverlap) tip+=" — Überschneidung ("+proKW[kw]+" im Urlaub)";
        if(isRepeat) tip+=" — wie im Vorjahr";
        h+='<td class="kwcolcell" style="'+st+'" title="'+tip+'"></td>';
      }
      h+='</tr>';
    }
  }
  h+='</tbody></table>';
  return h;
}

    h+='<span style="color:var(--muted);font-size:13px;">'+(e.birthday?('🎂 '+fmtBday(e.birthday)):'kein Geburtstag')+'</span>';
    h+='<button class="btn ghost sm" data-edit="'+e.id+'">Bearbeiten</button>';
    if(!e.me) h+='<button class="btn red-ghost" data-del="'+e.id+'">Entfernen</button>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div style="margin-top:16px;"><button class="btn" id="addPerson">+ Person hinzufügen</button></div>';

  // Schichten-Verwaltung
  var schichten=getSchichten();
  h+='<div class="exportbox"><h3>Schichten verwalten</h3>';
  h+='<p class="sub" style="margin-bottom:10px;">Lege fest, welche Schichten es gibt. Mitarbeiter ordnest du über „Bearbeiten" einer Schicht zu. Umbenennen verschiebt zugeordnete Mitarbeiter automatisch mit.</p>';
  h+='<div id="schichtList">';
  for(var si=0;si<schichten.length;si++){
    h+='<div class="emprow" style="border-bottom:1px solid var(--line);">';
    h+='<input type="text" class="schichtName" data-idx="'+si+'" value="'+esc(schichten[si])+'" style="flex:1;min-width:160px;">';
    h+='<button class="btn ghost sm" data-schicht-save="'+si+'">Umbenennen</button>';
    h+='<button class="btn red-ghost" data-schicht-del="'+si+'">Entfernen</button>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="exportrow" style="margin-top:12px;">';
  h+='<input type="text" id="newSchicht" placeholder="Neue Schicht, z. B. Frühschicht" style="flex:1;min-width:200px;">';
  h+='<button class="btn taupe" id="addSchicht">+ Schicht anlegen</button>';
  h+='</div></div>';

  // Cloud-Sync
  var st = SYNC_STATUS, on = syncEnabled();
  var stLabel = !on ? "nicht verbunden" : (st==="ok"?"verbunden ✓":(st==="saving"?"speichert…":(st==="loading"?"lädt…":(st==="error"?"Fehler":"bereit"))));
  h+='<div class="syncbox"><h3>Cloud-Synchronisierung</h3>';
  h+='<p class="sub" style="margin-bottom:10px;">Für Zugriff von Handy <b>und</b> Laptop. Einmalig bei <b>Firebase (Google)</b> ein kostenloses Projekt anlegen, Firestore aktivieren und hier <b>Projekt-ID</b> und <b>Web-API-Key</b> eintragen. Danach synchronisiert sich alles automatisch. <span class="syncstate '+(on?'on':'off')+'">'+stLabel+'</span></p>';
  h+='<div class="syncfields">';
  h+='<div><label class="lbl">Firebase Projekt-ID</label><input type="text" id="syncProj" value="'+esc(SYNC.projectId)+'" placeholder="z. B. vk2-urlaubsboard" style="width:100%;"></div>';
  h+='<div><label class="lbl">Web-API-Key</label><input type="text" id="syncKey" value="'+esc(SYNC.apiKey)+'" placeholder="AIza..." style="width:100%;"></div>';
  h+='</div>';
  h+='<div class="exportrow">';
  h+='<button class="btn" id="syncSave">Verbinden & speichern</button>';
  h+='<button class="btn taupe" id="syncPull">Von Cloud laden</button>';
  h+='<button class="btn ghost" id="syncOff">Trennen</button>';
  h+='</div></div>';

  // Export/Import
  h+='<div class="exportbox"><h3>Sicherung (Datei)</h3>';
  h+='<p class="sub" style="margin-bottom:10px;">Unabhängig von der Cloud kannst du die Daten als Datei sichern oder einlesen.</p>';
  h+='<div class="exportrow">';
  h+='<button class="btn taupe" id="btnExport">⬇ Exportieren</button>';
  h+='<button class="btn ghost" id="btnImport">⬆ Importieren</button>';
  h+='<input type="file" id="fileImport" accept="application/json,.json" style="display:none;">';
  h+='</div></div>';

  h+='</div>';
  return h;
}

function renderBday(){
  var emps=STATE.data.employees;
  var withB=[];
  for(var i=0;i<emps.length;i++) if(emps[i].birthday) withB.push(emps[i]);
  var now=new Date(), base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  function du(b){ var p=b.split("-"); var mm=p.length===3?+p[1]:+p[0]; var dd=p.length===3?+p[2]:+p[1]; var next=new Date(now.getFullYear(),mm-1,dd); if(next<base) next=new Date(now.getFullYear()+1,mm-1,dd); return Math.round((next-base)/86400000); }
  withB.sort(function(a,b){ return du(a.birthday)-du(b.birthday); });
  if(withB.length===0) return '<div class="card" style="padding:18px;"><div class="empty">Noch keine Geburtstage hinterlegt.<br>Trage sie im Reiter „Mitarbeiter" pro Person ein.</div></div>';
  var h='<div class="card"><div style="padding:18px 18px 0;"><p class="sub">Sortiert nach dem nächsten anstehenden Geburtstag.</p></div><div class="bdaygrid">';
  for(var k=0;k<withB.length;k++){
    var e=withB[k], d=du(e.birthday), soon=d<=14;
    h+='<div class="bcard'+(soon?' soon':'')+'"><span class="cake">🎂</span><div><div class="bn">'+esc(e.name)+'</div><div class="bd">'+fmtBday(e.birthday)+' · '+(d===0?'heute! 🎉':'in '+d+' Tagen')+'</div></div></div>';
  }
  h+='</div></div>';
  return h;
}

/* ====================== MODAL ====================== */
function counterHtml(id,label,val){
  return '<div class="counter"><span class="clabel">'+label+'</span><span class="cctrl"><button type="button" class="cbtn" data-dec="'+id+'">–</button><input type="number" min="0" id="'+id+'" class="cnum" value="'+val+'"><button type="button" class="cbtn" data-inc="'+id+'">+</button></span></div>';
}
function chkHtml(id,on,label){
  return '<label class="chk'+(on?' on':'')+'" data-for="'+id+'"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'> <span>'+label+'</span></label>';
}
function openEdit(id){
  var emps=STATE.data.employees,emp=null;
  for(var i=0;i<emps.length;i++) if(emps[i].id===id){ emp=emps[i]; break; }
  if(!emp) return;
  var bParts=emp.birthday?emp.birthday.split("-"):null;
  var initDate=bParts?(bParts.length===3?emp.birthday:"2000-"+bParts[0]+"-"+bParts[1]):"";
  var overlay=document.createElement("div"); overlay.className="modal-bg";
  var h='<div class="modal"><h3>Bearbeiten</h3><div class="fields">';
  h+='<div><label class="lbl">Name</label><input type="text" id="mName" value="'+esc(emp.name)+'"></div>';
  h+='<div><label class="lbl">Fachbereich</label><select id="mFach"><option value="">— kein Fachbereich —</option>';
  for(var f=0;f<FACHBEREICHE.length;f++) h+='<option value="'+FACHBEREICHE[f]+'"'+(emp.fach===FACHBEREICHE[f]?' selected':'')+'>'+FACHBEREICHE[f]+'</option>';
  h+='</select></div>';
  h+='<div><label class="lbl">Schicht</label><select id="mSchicht"><option value="">— keine Schicht —</option>';
  var _schichten=getSchichten();
  for(var sc=0;sc<_schichten.length;sc++) h+='<option value="'+esc(_schichten[sc])+'"'+(emp.schicht===_schichten[sc]?' selected':'')+'>'+esc(_schichten[sc])+'</option>';
  h+='</select></div>';
  h+=chkHtml("mAzubi",emp.azubi,"Auszubildende:r");
  h+=chkHtml("mVollzeit",emp.vollzeit,"Vollzeit");
  h+=chkHtml("mTeilzeit",emp.teilzeit,"Teilzeit");
  h+=counterHtml("mKinder","Anzahl Kinder",emp.kinder||0);
  h+=counterHtml("mPflege","Pflegebedürftige Angehörige",emp.pflege||0);
  h+=counterHtml("mBR","Betriebsrat (Anzahl Ämter)",emp.betriebsrat||0);
  h+=chkHtml("mBehind","Schwerbehinderung / Grad (GdB)",emp.behinderung);
  h+='<div id="mZusatzWrap" style="'+(emp.behinderung?'':'display:none;')+'">'+counterHtml("mZusatz","Zusätzliche Urlaubstage (auf 30 addiert)",emp.zusatzurlaub||0)+'</div>';
  h+='<div><label class="lbl">Geburtstag (Jahr egal)</label><input type="date" id="mBday" value="'+initDate+'"></div>';
  h+='</div><div class="actions"><button class="btn ghost" id="mCancel">Abbrechen</button><button class="btn" id="mSave">Speichern</button></div></div>';
  overlay.innerHTML=h;
  document.getElementById("modalRoot").appendChild(overlay);

  function upd(){
    ["mAzubi","mVollzeit","mTeilzeit"].forEach(function(cid){
      var el=overlay.querySelector('[data-for='+cid+']'); if(el) el.classList.toggle("on", document.getElementById(cid).checked);
    });
  }
  document.getElementById("mVollzeit").addEventListener("change",function(){ if(this.checked) document.getElementById("mTeilzeit").checked=false; upd(); });
  document.getElementById("mTeilzeit").addEventListener("change",function(){ if(this.checked) document.getElementById("mVollzeit").checked=false; upd(); });
  document.getElementById("mAzubi").addEventListener("change",upd);
  document.getElementById("mBehind").addEventListener("change",function(){
    var el=overlay.querySelector('[data-for=mBehind]'); if(el) el.classList.toggle("on", this.checked);
    document.getElementById("mZusatzWrap").style.display = this.checked ? "" : "none";
  });

  overlay.querySelectorAll("[data-inc]").forEach(function(b){ b.addEventListener("click",function(){ var el=document.getElementById(b.getAttribute("data-inc")); el.value=(parseInt(el.value,10)||0)+1; }); });
  overlay.querySelectorAll("[data-dec]").forEach(function(b){ b.addEventListener("click",function(){ var el=document.getElementById(b.getAttribute("data-dec")); el.value=Math.max(0,(parseInt(el.value,10)||0)-1); }); });

  overlay.addEventListener("mousedown",function(ev){ if(ev.target===overlay) close(); });
  function close(){ document.getElementById("modalRoot").removeChild(overlay); }
  document.getElementById("mCancel").addEventListener("click",close);
  document.getElementById("mSave").addEventListener("click",function(){
    emp.name=document.getElementById("mName").value.trim()||emp.name;
    emp.fach=document.getElementById("mFach").value;
    emp.azubi=document.getElementById("mAzubi").checked;
    emp.vollzeit=document.getElementById("mVollzeit").checked;
    emp.teilzeit=document.getElementById("mTeilzeit").checked;
    emp.kinder=Math.max(0,parseInt(document.getElementById("mKinder").value,10)||0);
    emp.pflege=Math.max(0,parseInt(document.getElementById("mPflege").value,10)||0);
    emp.betriebsrat=Math.max(0,parseInt(document.getElementById("mBR").value,10)||0);
    emp.schicht=document.getElementById("mSchicht").value;
    emp.behinderung=document.getElementById("mBehind").checked;
    emp.zusatzurlaub=emp.behinderung?Math.max(0,parseInt(document.getElementById("mZusatz").value,10)||0):0;
    var bday=document.getElementById("mBday").value, b="";
    if(bday){ var p=bday.split("-"); b=p[1]+"-"+p[2]; }
    emp.birthday=b;
    saveData(); close(); render();
  });
}
/* ====================== EVENTS ====================== */
function bindEvents(){
  var app=document.getElementById("app");
  app.querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click",function(){ STATE.tab=b.getAttribute("data-tab"); render(); }); });
  app.querySelectorAll("[data-year]").forEach(function(b){ b.addEventListener("click",function(){ STATE.year+=parseInt(b.getAttribute("data-year"),10); render(); }); });
  app.querySelectorAll("[data-view]").forEach(function(b){ b.addEventListener("click",function(){ STATE.view=b.getAttribute("data-view"); render(); }); });
  var sp=document.getElementById("selPerson"); if(sp) sp.addEventListener("change",function(){ STATE.selPerson=sp.value; render(); });
  app.querySelectorAll("[data-day]").forEach(function(c){ c.addEventListener("click",function(){ toggleDay(c.getAttribute("data-person"),c.getAttribute("data-day")); }); });
  app.querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click",function(){ openEdit(b.getAttribute("data-edit")); }); });
  app.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click",function(){
    var id=b.getAttribute("data-del"),emps=STATE.data.employees,nm="";
    for(var i=0;i<emps.length;i++) if(emps[i].id===id) nm=emps[i].name;
    if(confirm(nm+" wirklich entfernen?")){ STATE.data.employees=emps.filter(function(e){ return e.id!==id; }); saveData(); render(); }
  }); });
  var add=document.getElementById("addPerson");
  if(add) add.addEventListener("click",function(){ var id="e"+Date.now(); STATE.data.employees.push(mk(id,"Neuer Mitarbeiter",{})); saveData(); render(); });

  // Schichten verwalten
  var addS=document.getElementById("addSchicht");
  if(addS) addS.addEventListener("click",function(){
    var v=document.getElementById("newSchicht").value.trim();
    if(!v) return;
    if(!Array.isArray(STATE.data.schichten)) STATE.data.schichten=DEFAULT_SCHICHTEN.slice();
    if(STATE.data.schichten.indexOf(v)>=0){ alert("Diese Schicht gibt es schon."); return; }
    STATE.data.schichten.push(v); saveData(); render();
  });
  document.querySelectorAll("[data-schicht-save]").forEach(function(b){ b.addEventListener("click",function(){
    var idx=parseInt(b.getAttribute("data-schicht-save"),10);
    var inp=document.querySelector('.schichtName[data-idx="'+idx+'"]');
    if(!inp) return;
    var neu=inp.value.trim(); if(!neu) return;
    var alt=STATE.data.schichten[idx];
    if(neu===alt) return;
    if(STATE.data.schichten.indexOf(neu)>=0){ alert("Diese Schicht gibt es schon."); return; }
    // Mitarbeiter mit alter Schicht auf neuen Namen umziehen
    STATE.data.employees.forEach(function(e){ if(e.schicht===alt) e.schicht=neu; });
    STATE.data.schichten[idx]=neu;
    saveData(); render();
  }); });
  document.querySelectorAll("[data-schicht-del]").forEach(function(b){ b.addEventListener("click",function(){
    var idx=parseInt(b.getAttribute("data-schicht-del"),10);
    var name=STATE.data.schichten[idx];
    var anzahl=STATE.data.employees.filter(function(e){ return e.schicht===name; }).length;
    var msg="Schicht \""+name+"\" entfernen?";
    if(anzahl>0) msg+="\n\n"+anzahl+" Mitarbeiter stehen dann auf keine Schicht.";
    if(confirm(msg)){
      STATE.data.employees.forEach(function(e){ if(e.schicht===name) e.schicht=""; });
      STATE.data.schichten.splice(idx,1);
      saveData(); render();
    }
  }); });

  var ex=document.getElementById("btnExport"); if(ex) ex.addEventListener("click",exportToFile);
  var im=document.getElementById("btnImport"), fi=document.getElementById("fileImport");
  if(im&&fi){
    im.addEventListener("click",function(){ fi.click(); });
    fi.addEventListener("change",function(){
      var f=fi.files&&fi.files[0]; if(!f) return;
      var reader=new FileReader();
      reader.onload=function(){
        try{ var imported=JSON.parse(reader.result);
          if(!imported||!imported.employees||!imported.employees.length) throw new Error("Format");
          if(confirm("Import überschreibt die aktuellen Daten. Fortfahren?")){ applyData(imported); saveData(); alert("Daten importiert."); render(); }
        }catch(err){ alert("Import fehlgeschlagen: keine gültige VK2-Datei."); }
        fi.value="";
      };
      reader.readAsText(f);
    });
  }

  // Sync-Buttons
  var sk=document.getElementById("syncSave");
  if(sk) sk.addEventListener("click",function(){
    SYNC.projectId=document.getElementById("syncProj").value.trim();
    SYNC.apiKey=document.getElementById("syncKey").value.trim();
    saveSyncCfg(SYNC);
    if(syncEnabled()){ SYNC_STATUS="saving"; render(); cloudPushNow(); }
    else { SYNC_STATUS="off"; render(); }
  });
  var spull=document.getElementById("syncPull");
  if(spull) spull.addEventListener("click",function(){
    SYNC.projectId=document.getElementById("syncProj").value.trim();
    SYNC.apiKey=document.getElementById("syncKey").value.trim();
    saveSyncCfg(SYNC);
    if(!syncEnabled()){ alert("Bitte zuerst Projekt-ID und Web-API-Key eintragen."); return; }
    cloudLoad(function(rec){
      if(rec){ applyData(rec); saveLocal(); alert("Daten aus der Cloud geladen."); render(); }
      else { alert("Noch keine Daten in der Cloud (oder Projekt-ID/Key prüfen). Beim ersten Speichern werden deine aktuellen Daten hochgeladen."); render(); }
    });
  });
  var soff=document.getElementById("syncOff");
  if(soff) soff.addEventListener("click",function(){ SYNC={projectId:"",apiKey:""}; saveSyncCfg(SYNC); SYNC_STATUS="off"; render(); });
}

/* ====================== START ====================== */
initData();
render();
// Beim Start automatisch aus Cloud nachladen, wenn konfiguriert
if(syncEnabled()){
  cloudLoad(function(rec){ if(rec){ applyData(rec); saveLocal(); render(); } });
}
</script>
