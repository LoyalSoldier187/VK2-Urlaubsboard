    "2026-06-04": "Fronleichnam", "2026-10-03": "Tag der Deutschen Einheit",
    "2026-12-25": "1. Weihnachtsfeiertag", "2026-12-26": "2. Weihnachtsfeiertag",
  },
  2027: {
    "2027-01-01": "Neujahr", "2027-03-26": "Karfreitag", "2027-03-29": "Ostermontag",

    "2027-12-25": "1. Weihnachtsfeiertag", "2027-12-26": "2. Weihnachtsfeiertag",

function feiertagName(ds) {
  const y = parseInt(ds.slice(0, 4));
  return (FEIERTAGE[y] || {})[ds] || null;
}
const URLAUBS_LIMIT = 30;

const BETON_URI = `url("data:image/svg+xml;utf8,${encodeURIComponent(BETON_SVG)}")`;

// ---------- Storage (localStorage, geräteweit lokal) ----------
const KEY = "vk2:data";
function loadData() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveData(data) {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
}

// Export als Download-Datei
function exportToFile(data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  a.href = url;
  a.download = "vk2-urlaubsboard-" + stamp + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// in einem FRÜHEREN Jahr (vor `year`) schon Urlaub hatte.
function priorYearMMDD(emp, year) {
  const set = new Set();
  (emp.urlaub || []).forEach((ds) => {
    const y = parseInt(ds.slice(0, 4));
    if (y < year) set.add(ds.slice(5)); // "MM-DD"
  });
  return set;
}

function fmtBday(b) {
  const p = b.split("-");
  if (p.length === 3) return parseInt(p[2]) + ". " + MONTHS_FULL[parseInt(p[1]) - 1];
  if (p.length === 2) return parseInt(p[1]) + ". " + MONTHS_FULL[parseInt(p[0]) - 1];
  return b;
}

function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("plan");
  const [year, setYear] = useState(2026);
  const [viewMode, setViewMode] = useState("month");
  const [selPerson, setSelPerson] = useState("me");
  const [editEmp, setEditEmp] = useState(null);

  useEffect(() => {
    (async () => {
      let d = await loadData();
      const LAYOUT_VERSION = 4; // erhöhen, wenn DEFAULT_EMP-Reihenfolge/Stammdaten neu gesetzt werden sollen
      if (!d) {
        d = { employees: DEFAULT_EMP, layout: LAYOUT_VERSION };
        await saveData(d);
      } else {
        // Einmalige Übernahme: alte Platzhalter ODER veraltete Layout-Version -> Stammdaten & Reihenfolge neu setzen
        const hatPlatzhalter = d.employees.some((e) => /^Mitarbeiter \d+$/.test(e.name)) ||
          d.employees.some((e) => e.me && e.name === "Ich (VK2-Leitung)");
        if (hatPlatzhalter || (d.layout || 0) < LAYOUT_VERSION) {
          d = { ...d, layout: LAYOUT_VERSION, employees: DEFAULT_EMP.map((def) => {
            const alt = d.employees.find((e) => e.id === def.id);
            // Vorhandene Urlaube/Geburtstage behalten, Stammdaten & Reihenfolge neu setzen
            return alt ? { ...def, urlaub: alt.urlaub || [], birthday: alt.birthday || "" } : def;
          }) };
          await saveData(d);
        }
      }
      setData(d);
    })();
  }, []);

  const persist = useCallback((nd) => {
    setData(nd);
    saveData(nd);
  }, []);

  if (!data)
    return <div style={{ padding: 40, textAlign: "center", color: "#000000", fontFamily: "Helvetica, Arial, sans-serif", fontWeight: 700 }}>Lade Urlaubsboard…</div>;

  const ferSet = ferienDaysSet(year);
  const today = todayISO();

  const toggleDay = (empId, dateStr) => {
    // Feiertage sind ohnehin frei und nicht als Urlaub buchbar
    if (feiertagName(dateStr)) return;
    persist({
      ...data,
      employees: data.employees.map((e) => {
        if (e.id !== empId) return e;
        const has = e.urlaub.includes(dateStr);
        return { ...e, urlaub: has ? e.urlaub.filter((x) => x !== dateStr) : [...e.urlaub, dateStr] };
      }),
    });
  };

  const person = data.employees.find((e) => e.id === selPerson) || data.employees[0];

  const C = {
    bg: "#e8e8e8", card: "#ffffff", ink: "#000000", muted: "#6b6b6b", line: "#000000",
    accent: "#e30613", accentDark: "#b30410", ferien: "#f4c400", urlaub: "#e30613",
    urlaubLine: "#000000", weekend: "#dcdcdc", today: "#e30613",
    repeat: "#000000", repeatBg: "#d4d4d4", vorjahr: "#e0e0e0",
    feiertag: "#000000", feiertagLine: "#000000", over: "#e30613", overBg: "#f7c6c9",
    overLine: "#000000", overlapRepeat: "#000000",
  };

  const tabBtn = (id, label) => (
    <button
      onClick={() => setTab(id)}
      style={{
        flex: 1, padding: "10px 10px", border: "none", borderRadius: 0, cursor: "pointer",
        fontSize: 14, fontWeight: 700, whiteSpace: "nowrap", letterSpacing: 0.3,
        background: tab === id ? C.accent : "transparent",
        color: tab === id ? "#fff" : C.ink,
      }}
    >
      {label}
    </button>
  );

  return (
    <div style={{ fontFamily: "'Helvetica Neue', Helvetica, Arial, sans-serif", color: C.ink, padding: 12, minHeight: "100vh",
      background: "#eeeeee" }}>
      <div style={{ maxWidth: 1200, margin: "0 auto" }}>
        <header style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, borderBottom: "4px solid #000", paddingBottom: 10 }}>
          <h1 style={{ fontSize: 24, letterSpacing: "-0.5px", display: "flex", alignItems: "center", gap: 10, margin: 0, textTransform: "uppercase", fontWeight: 800 }}>
            <span style={{ background: C.accent, color: "#fff", fontSize: 13, padding: "4px 10px", borderRadius: 0, fontWeight: 800, letterSpacing: 2 }}>VK2</span>
            Urlaubsboard
          </h1>
        </header>

        <div style={{ display: "flex", gap: 0, background: C.card, padding: 0, borderRadius: 0, border: `2px solid ${C.line}`, marginBottom: 14 }}>
          {tabBtn("plan", "Urlaubsplan")}
          {tabBtn("team", "Mitarbeiter")}
          {tabBtn("bday", "Geburtstage")}
        </div>

        {tab === "plan" && (
          <PlanTab {...{ C, data, year, setYear, viewMode, setViewMode, selPerson, setSelPerson, person, ferSet, today, toggleDay }} />
        )}
        {tab === "team" && <TeamTab {...{ C, data, persist, setEditEmp }} />}
        {tab === "bday" && <Birthdays {...{ C, data }} />}

        {editEmp && (
          <EditModal
            C={C}
            emp={editEmp}
            onClose={() => setEditEmp(null)}
            onSave={(upd) => {
              persist({ ...data, employees: data.employees.map((e) => (e.id === upd.id ? upd : e)) });
              setEditEmp(null);
            }}
          />
        )}
      </div>
    </div>
  );
}

function Legend({ C }) {
  const chip = (style) => <span style={{ width: 18, height: 18, borderRadius: 0, display: "inline-block", border: "1px solid #000", flexShrink: 0, ...style }} />;
  const item = (node, label) => (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 7 }}>{node}{label}</span>
  );
  return (
    <div style={{ background: "#fff", border: "2px solid #000", padding: "12px 16px", marginBottom: 14 }}>
      <div style={{ display: "flex", gap: "14px 24px", alignItems: "center", fontSize: 12.5, color: C.ink, flexWrap: "wrap", fontWeight: 600, lineHeight: 1.4 }}>
        {item(chip({ background: C.accent }), " Urlaub")}
        {item(chip({ background: "#000000" }), " Feiertag")}
        {item(chip({ background: C.ferien }), " Ferien Hessen")}
        {item(chip({ background: C.weekend }), " Wochenende")}
        {item(chip({ background: C.vorjahr, boxShadow: `inset 0 0 0 3px #000000` }), " wie Vorjahr")}
        {item(chip({ backgroundImage: `repeating-linear-gradient(45deg, ${C.accent}, ${C.accent} 3px, #000 3px, #000 5px)` }), " Überschneidung")}
        {item(chip({ backgroundImage: `repeating-linear-gradient(45deg, ${C.accent}, ${C.accent} 3px, #000 3px, #000 5px)`, boxShadow: `inset 0 0 0 3px #000000` }), " Überschn. + Vorjahr")}
        {item(chip({ background: "#fff", border: `3px solid ${C.accent}` }), " Heute")}
      </div>
    </div>
  );
}

function PlanTab({ C, data, year, setYear, viewMode, setViewMode, selPerson, setSelPerson, person, ferSet, today, toggleDay }) {
  const vtBtn = (id, label) => (
    <button
      onClick={() => setViewMode(id)}
      style={{
        border: "none", background: viewMode === id ? C.accent : "transparent",
        color: viewMode === id ? "#fff" : C.ink, padding: "8px 14px", borderRadius: 0,
        fontSize: 13, fontWeight: 700, cursor: "pointer",
      }}
    >
      {label}
    </button>
  );
  return (
    <>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, background: C.card, border: `1px solid ${C.line}`, borderRadius: 0, padding: 4 }}>
          <button onClick={() => setYear((y) => y - 1)} style={{ border: "none", background: "transparent", width: 36, height: 36, borderRadius: 0, cursor: "pointer", fontSize: 20, color: C.accent }}>‹</button>
          <span style={{ fontWeight: 700, minWidth: 52, textAlign: "center", fontSize: 16 }}>{year}</span>
          <button onClick={() => setYear((y) => y + 1)} style={{ border: "none", background: "transparent", width: 36, height: 36, borderRadius: 0, cursor: "pointer", fontSize: 20, color: C.accent }}>›</button>
        </div>
        <div style={{ display: "flex", gap: 5, background: C.card, border: `1px solid ${C.line}`, borderRadius: 0, padding: 4 }}>
          {vtBtn("month", "Monatsansicht")}
          {vtBtn("table", "Team-Übersicht")}
        </div>
      </div>

      <Legend C={C} />

      {viewMode === "month" ? (
        <>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12, flexWrap: "wrap" }}>
            <label style={{ fontSize: 12, color: C.muted, fontWeight: 600 }}>Person:</label>
            <select value={selPerson} onChange={(e) => setSelPerson(e.target.value)} style={{ flex: 1, minWidth: 180, fontSize: 16, padding: "10px 12px", border: `1px solid ${C.line}`, borderRadius: 0 }}>
              {data.employees.map((e) => (<option key={e.id} value={e.id}>{e.name}</option>))}
            </select>
            {(() => {
              const jahrTage = person.urlaub.filter((d) => d.startsWith(year + "-"));
              // Nur echte Arbeitstage zählen (kein Wochenende, kein Feiertag)
              const zaehlbar = jahrTage.filter((d) => {
                const [Y, M, D] = d.split("-").map(Number);
                const dow = new Date(Y, M - 1, D).getDay();
                if (dow === 0 || dow === 6) return false;
                if (feiertagName(d)) return false;
                return true;
              }).length;
              const rest = URLAUBS_LIMIT - zaehlbar;
              const over = zaehlbar > URLAUBS_LIMIT;
              return (
                <span style={{ fontSize: 13, fontWeight: 700, padding: "5px 12px", borderRadius: 0,
                  color: over ? "#fff" : rest <= 3 ? C.over : C.ink,
                  background: over ? C.over : rest <= 3 ? C.overBg : C.weekend }}>
                  {zaehlbar} / {URLAUBS_LIMIT} Urlaubstage {over ? `· ${zaehlbar - URLAUBS_LIMIT} zu viel!` : `· ${rest} übrig`}
                </span>
              );
            })()}
            {(() => {
              const prior = priorYearMMDD(person, year);
              const rep = person.urlaub.filter((d) => d.startsWith(year + "-") && prior.has(d.slice(5))).length;
              if (rep === 0) return null;
              return (
                <span style={{ fontSize: 13, color: C.repeat, fontWeight: 600, background: C.repeatBg, padding: "4px 10px", borderRadius: 0 }}>
                  ⚠ {rep} {rep === 1 ? "Tag" : "Tage"} wie im Vorjahr
                </span>
              );
            })()}
          </div>
          <div style={{ background: C.card, border: `2px solid ${C.line}`, borderRadius: 0, overflow: "hidden" }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 14, padding: 14 }}>
              {[...Array(12).keys()].map((m) => (
                <MonthCard key={m} C={C} year={year} month={m} person={person} priorSet={priorYearMMDD(person, year)} ferSet={ferSet} today={today} onToggle={toggleDay} />
              ))}
            </div>
          </div>
          <p style={{ fontSize: 12, color: C.muted, marginTop: 10, lineHeight: 1.5 }}>
            Tipp: Tag antippen = Urlaub setzen oder löschen. Oben die Person umschalten. Deine Daten liegen privat auf deinem Account.
          </p>
        </>
      ) : (
        <>
          <div style={{ background: C.card, border: `2px solid ${C.line}`, borderRadius: 0, overflow: "auto" }}>
            <TableView C={C} data={data} year={year} ferSet={ferSet} today={today} onToggle={toggleDay} />
          </div>
          <p style={{ fontSize: 12, color: C.muted, marginTop: 10, lineHeight: 1.5 }}>
            Ganzes Team auf einen Blick. Auf dem Handy seitlich wischen zum Scrollen. Ferien Hessen (Kultusministerium) sind gelb hinterlegt.
          </p>
        </>
      )}
    </>
  );
}

function MonthCard({ C, year, month, person, priorSet, ferSet, today, onToggle }) {
  const dim = daysInMonth(year, month);
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= dim; d++) cells.push(d);

  return (
    <div style={{ border: `1px solid ${C.line}`, borderRadius: 0, padding: 12 }}>
      <h4 style={{ fontSize: 15, marginBottom: 10, textAlign: "center", margin: "0 0 10px" }}>{MONTHS_FULL[month]}</h4>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3, marginBottom: 4 }}>
        {WD_MON.map((w) => (<span key={w} style={{ textAlign: "center", fontSize: 11, color: C.muted, fontWeight: 600, padding: "2px 0" }}>{w}</span>))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3 }}>
        {cells.map((d, i) => {
          if (d === null) return <div key={"e" + i} />;
          const ds = iso(year, month, d);
          const dow = new Date(year, month, d).getDay();
          const isWe = dow === 0 || dow === 6;
          const isFer = ferSet.has(ds);
          const ftName = feiertagName(ds);
          const isUrl = person.urlaub.includes(ds);
          const isRepeat = isUrl && priorSet && priorSet.has(ds.slice(5));
          const isTod = ds === today;
          let bg = "#ffffff";
          if (isWe) bg = C.weekend;
          if (isFer) bg = C.ferien;
          if (ftName) bg = "#000000";   // Feiertag = schwarz
          if (isUrl) bg = C.accent;     // Urlaub = rot
          if (isRepeat) bg = C.vorjahr; // wie Vorjahr = gelb
          const style = {
            aspectRatio: "1/1", display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 14, borderRadius: 0, cursor: "pointer", userSelect: "none", background: bg,
            fontWeight: isUrl || ftName ? 800 : 500,
            color: ftName ? "#ffffff" : isRepeat ? "#000000" : isUrl ? "#ffffff" : isWe && !isFer ? C.muted : C.ink,
            border: isTod ? `3px solid ${C.accent}` : `1px solid #000000`,
            boxShadow: isRepeat ? `inset 0 0 0 3px #000000` : "none",
            backgroundImage: isFer && isUrl && !isRepeat ? `repeating-linear-gradient(45deg, ${C.accent}, ${C.accent} 6px, ${C.ferien} 6px, ${C.ferien} 12px)` : "none",
            position: "relative",
          };
          const tip = ftName ? ftName : isRepeat ? "Selber Tag wie im Vorjahr" : undefined;
          return (
            <div key={ds} style={style} onClick={() => onToggle(person.id, ds)} title={tip}>
              {d}
              {isRepeat && (
                <span style={{ position: "absolute", top: 1, right: 2, fontSize: 9, color: "#000000", fontWeight: 900, lineHeight: 1 }}>↻</span>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TableView({ C, data, year, ferSet, today, onToggle }) {
  const th = { border: `1px solid ${C.line}`, background: "#f2f2f2", padding: "4px 2px", fontWeight: 600, color: C.muted, fontSize: 10, textAlign: "center" };
  const nameTh = { position: "sticky", left: 0, zIndex: 3, background: C.card, textAlign: "left", padding: "8px 10px", minWidth: 150, fontSize: 13, border: `1px solid ${C.line}` };

  const zaehleUrlaub = (emp) => emp.urlaub.filter((d) => {
    if (!d.startsWith(year + "-")) return false;
    const [Y, M, D] = d.split("-").map(Number);
    const dow = new Date(Y, M - 1, D).getDay();
    if (dow === 0 || dow === 6) return false;
    if (feiertagName(d)) return false;
    return true;
  }).length;

  // Wie viele Mitarbeiter haben an einem bestimmten Tag Urlaub? -> für Überschneidungen
  const urlaubProTag = {};
  data.employees.forEach((emp) => {
    emp.urlaub.forEach((d) => {
      if (d.startsWith(year + "-")) urlaubProTag[d] = (urlaubProTag[d] || 0) + 1;
    });
  });

  return (
    <table style={{ borderCollapse: "collapse", width: "100%", fontSize: 11 }}>
      <thead>
        <tr>
          <th style={nameTh} rowSpan={2}>Mitarbeiter</th>
          <th style={{ ...th, position: "sticky", left: 150, zIndex: 3, background: "#000000", fontSize: 11, color: "#ffffff", minWidth: 62, padding: "4px 6px" }} rowSpan={2}>Urlaub<br />/ {URLAUBS_LIMIT}</th>
          {[...Array(12).keys()].map((m) => (
            <th key={m} style={{ ...th, fontSize: 12, color: "#ffffff", background: "#000000" }} colSpan={daysInMonth(year, m)}>{MONTHS[m]}</th>
          ))}
        </tr>
        <tr>
          {[...Array(12).keys()].flatMap((m) =>
            Array.from({ length: daysInMonth(year, m) }, (_, d) => {
              const dow = new Date(year, m, d + 1).getDay();
              return (<th key={m + "-" + d} style={{ ...th, borderLeft: d === 0 ? "3px solid #000000" : `1px solid ${C.line}` }}>{d + 1}<br />{WD[dow]}</th>);
            })
          )}
        </tr>
      </thead>
      <tbody>
        {data.employees.map((emp) => {
          const prior = priorYearMMDD(emp, year);
          const fr = FACH_ROW[emp.fach];
          const nameBg = fr ? fr.bg : C.card;
          const used = zaehleUrlaub(emp);
          const over = used > URLAUBS_LIMIT;
          const tight = !over && URLAUBS_LIMIT - used <= 3;
          return (
          <tr key={emp.id}>
            <td style={{ position: "sticky", left: 0, zIndex: 2, background: nameBg, textAlign: "left", padding: "6px 10px", fontSize: 13, fontWeight: 600, minWidth: 150, whiteSpace: "nowrap", border: `1px solid ${C.line}`, borderLeft: fr ? `4px solid ${fr.line}` : `1px solid ${C.line}`, color: emp.me ? C.accent : C.ink }}>
              {emp.name}
              {emp.fach && <span style={{ display: "block", fontSize: 10, color: C.muted, fontWeight: 500 }}>{emp.fach}</span>}
            </td>
            <td style={{ position: "sticky", left: 150, zIndex: 2, textAlign: "center", fontSize: 13, fontWeight: 700, border: `1px solid ${C.line}`, minWidth: 62,
              background: over ? C.over : tight ? C.overBg : "#fff",
              color: over ? "#fff" : tight ? C.over : C.ink }}
              title={over ? (used - URLAUBS_LIMIT) + " Tage über dem Limit!" : (URLAUBS_LIMIT - used) + " Tage übrig"}>
              {used}{over ? " ⚠" : ""}
            </td>
            {[...Array(12).keys()].flatMap((m) =>
              Array.from({ length: daysInMonth(year, m) }, (_, d) => {
                const ds = iso(year, m, d);
                const dow = new Date(year, m, d + 1).getDay();
                const isWe = dow === 0 || dow === 6;
                const isFer = ferSet.has(ds);
                const ftName = feiertagName(ds);
                const isUrl = emp.urlaub.includes(ds);
                const isRepeat = isUrl && prior.has(ds.slice(5));
                const isOverlap = isUrl && (urlaubProTag[ds] || 0) >= 2; // mind. 2 MA im Urlaub
                const isTod = ds === today;
                let bg = "#ffffff";
                if (isWe) bg = C.weekend;
                if (isFer) bg = C.ferien;
                if (ftName) bg = "#000000";      // Feiertag = schwarz voll
                if (isUrl) bg = C.accent;        // Urlaub = rot voll
                if (isRepeat && !isOverlap) bg = C.vorjahr;  // reine Wiederholung = gelb voll
                // Rahmen / Muster zur Unterscheidung bei nur 4 Farben
                let shadow = "none";
                if (isOverlap && isRepeat) shadow = `inset 0 0 0 3px #000000`;   // Überschn.+Vorjahr = dicker schwarzer Rahmen
                else if (isRepeat) shadow = `inset 0 0 0 2px #000000`;           // Vorjahr = schwarzer Rahmen
                // Überschneidung = schwarzes Diagonalmuster auf Rot
                let bgImage = "none";
                if (isOverlap) bgImage = `repeating-linear-gradient(45deg, ${C.accent}, ${C.accent} 4px, #000000 4px, #000000 7px)`;
                else if (isFer && isUrl && !isRepeat) bgImage = `repeating-linear-gradient(45deg, ${C.accent}, ${C.accent} 5px, ${C.ferien} 5px, ${C.ferien} 10px)`;
                const style = {
                  width: 20, height: 30, cursor: "pointer", border: `1px solid #000000`,
                  borderLeft: d === 0 ? "3px solid #000000" : `1px solid #000000`,
                  background: bg,
                  boxShadow: shadow,
                  outline: isTod ? `3px solid ${C.accent}` : "none", outlineOffset: -3,
                  backgroundImage: bgImage,
                };
                const tip = emp.name + " · " + (d + 1) + ". " + MONTHS_FULL[m] + " " + year
                  + (ftName ? " — " + ftName : "") + (isFer ? " (Ferien)" : "")
                  + (isOverlap ? " — Überschneidung (" + urlaubProTag[ds] + " im Urlaub)" : "")
                  + (isRepeat ? " — wie im Vorjahr" : "");
                return (<td key={ds} style={style} title={tip} onClick={() => onToggle(emp.id, ds)} />);
              })
            )}
          </tr>
          );
        })}
      </tbody>
    </table>
  );
}

function TeamTab({ C, data, persist, setEditEmp }) {
  const fileRef = useRef(null);
  const btn = (bg, color, extra) => ({ border: "none", background: bg, color, padding: "8px 12px", borderRadius: 0, fontWeight: 600, cursor: "pointer", fontSize: 14, ...extra });
  return (
    <div style={{ background: C.card, border: `2px solid ${C.line}`, borderRadius: 0, padding: 16 }}>
      <p style={{ color: C.muted, fontSize: 13, margin: "2px 0 14px" }}>
        {data.employees.length} Personen im Team VK2. Namen anpassen, Geburtstag hinterlegen oder Personen verwalten.
      </p>
      <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
        {data.employees.map((emp) => (
          <div key={emp.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "11px 10px", borderRadius: 0, flexWrap: "wrap", borderBottom: `1px solid ${C.line}` }}>
            <span style={{ fontWeight: 700, minWidth: 120 }}>{emp.name}</span>
            {emp.me && <span style={{ fontSize: 11, background: C.accent, color: "#fff", padding: "2px 8px", borderRadius: 0, fontWeight: 700, letterSpacing: 0.5 }}>ICH</span>}
            {emp.fach && <span style={{ fontSize: 11, background: (FACH_FARBE[emp.fach] || C.muted), color: "#fff", padding: "2px 8px", borderRadius: 0, fontWeight: 700 }}>{emp.fach}</span>}
            {emp.azubi && <span style={{ fontSize: 11, background: "#fff", color: "#000", border: "1.5px solid #000", padding: "1px 8px", borderRadius: 0, fontWeight: 700 }}>Azubi</span>}
            {emp.teilzeit && <span style={{ fontSize: 11, background: "#fff", color: "#000", border: "1.5px solid #000", padding: "1px 8px", borderRadius: 0, fontWeight: 700 }}>Teilzeit</span>}
            {emp.vollzeit && <span style={{ fontSize: 11, background: "#e0e0e0", color: "#000", padding: "2px 8px", borderRadius: 0, fontWeight: 700 }}>Vollzeit</span>}
            {emp.pflege && <span style={{ fontSize: 11, background: "#000", color: "#fff", padding: "2px 8px", borderRadius: 0, fontWeight: 700 }}>🫂 Pflege</span>}
            {emp.schulkinder && <span style={{ fontSize: 11, background: "#000", color: "#fff", padding: "2px 8px", borderRadius: 0, fontWeight: 700 }}>🎒 Schulkinder</span>}
            <span style={{ flex: 1 }} />
            <span style={{ color: C.muted, fontSize: 13 }}>{emp.birthday ? "🎂 " + fmtBday(emp.birthday) : "kein Geburtstag"}</span>
            <button style={btn(C.bg, C.ink, { border: `1px solid ${C.line}` })} onClick={() => setEditEmp(emp)}>Bearbeiten</button>
            {!emp.me && (
              <button style={btn("#fff", C.accent, { border: `1.5px solid ${C.accent}` })} onClick={() => { if (confirm(emp.name + " wirklich entfernen?")) persist({ ...data, employees: data.employees.filter((x) => x.id !== emp.id) }); }}>
                Entfernen
              </button>
            )}
          </div>
        ))}
      </div>
      <div style={{ marginTop: 16 }}>
        <button
          style={btn(C.accent, "#fff", { padding: "11px 16px", fontSize: 15 })}
          onClick={() => { const id = "e" + Date.now(); persist({ ...data, employees: [...data.employees, { id, name: "Neuer Mitarbeiter", me: false, birthday: "", urlaub: [], azubi: false, schulkinder: false, pflege: false, teilzeit: false, vollzeit: false, fach: "" }] }); }}
        >
          + Person hinzufügen
        </button>
      </div>

      <div style={{ marginTop: 24, borderTop: "2px solid #000", paddingTop: 16 }}>
        <h3 style={{ fontSize: 15, textTransform: "uppercase", letterSpacing: 0.5, margin: "0 0 6px" }}>Daten sichern & übertragen</h3>
        <p style={{ color: C.muted, fontSize: 13, margin: "0 0 12px", lineHeight: 1.5 }}>
          Deine Daten liegen nur auf diesem Gerät. Zum Übertragen auf ein anderes Gerät (z.&nbsp;B. Handy&nbsp;→&nbsp;PC): hier <b>exportieren</b>, die Datei aufs andere Gerät bringen und dort <b>importieren</b>.
        </p>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <button style={btn("#000", "#fff", { padding: "11px 16px", fontSize: 14 })} onClick={() => exportToFile(data)}>
            ⬇ Exportieren (Datei)
          </button>
          <button style={btn("#fff", "#000", { padding: "11px 16px", fontSize: 14, border: "2px solid #000" })} onClick={() => fileRef.current && fileRef.current.click()}>
            ⬆ Importieren (Datei)
          </button>
          <input
            ref={fileRef}
            type="file"
            accept="application/json,.json"
            style={{ display: "none" }}
            onChange={(e) => {
              const f = e.target.files && e.target.files[0];
              if (!f) return;
              const reader = new FileReader();
              reader.onload = () => {
                try {
                  const imported = JSON.parse(reader.result);
                  if (!imported || !Array.isArray(imported.employees)) throw new Error("Ungültiges Format");
                  if (confirm("Import überschreibt die aktuellen Daten auf diesem Gerät. Fortfahren?")) {
                    persist(imported);
                    alert("Daten erfolgreich importiert.");
                  }
                } catch (err) {
                  alert("Import fehlgeschlagen: keine gültige VK2-Datei.");
                }
                e.target.value = "";
              };
              reader.readAsText(f);
            }}
          />
        </div>
      </div>
    </div>
  );
}

function Birthdays({ C, data }) {
  const withB = data.employees.filter((e) => e.birthday);
  const now = new Date();
  const key = (b) => { const p = b.split("-"); const mm = p.length === 3 ? +p[1] : +p[0]; const dd = p.length === 3 ? +p[2] : +p[1]; return { mm, dd }; };
  const daysUntil = (b) => {
    const { mm, dd } = key(b);
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let next = new Date(now.getFullYear(), mm - 1, dd);
    if (next < base) next = new Date(now.getFullYear() + 1, mm - 1, dd);
    return Math.round((next - base) / 86400000);
  };
  const sorted = [...withB].sort((a, b) => daysUntil(a.birthday) - daysUntil(b.birthday));

  if (sorted.length === 0)
    return (
      <div style={{ background: C.card, border: `2px solid ${C.line}`, borderRadius: 0, padding: 16 }}>
        <div style={{ color: C.muted, padding: 24, textAlign: "center", lineHeight: 1.6 }}>
          Noch keine Geburtstage hinterlegt.<br />Trage sie im Reiter „Mitarbeiter" pro Person ein.
        </div>
      </div>
    );

  return (
    <div style={{ background: C.card, border: `2px solid ${C.line}`, borderRadius: 0, overflow: "hidden" }}>
      <div style={{ padding: "16px 16px 0" }}>
        <p style={{ color: C.muted, fontSize: 13, margin: "2px 0 14px" }}>Sortiert nach dem nächsten anstehenden Geburtstag.</p>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(240px,1fr))", gap: 10, padding: 16 }}>
        {sorted.map((e) => {
          const du = daysUntil(e.birthday);
          const soon = du <= 14;
          return (
            <div key={e.id} style={{ border: soon ? `3px solid ${C.accent}` : `1.5px solid #000`, background: soon ? "#f7c6c9" : "#fff", borderRadius: 0, padding: 14, display: "flex", alignItems: "center", gap: 12 }}>
              <span style={{ fontSize: 26 }}>🎂</span>
              <div>
                <div style={{ fontWeight: 700 }}>{e.name}</div>
                <div style={{ color: C.muted, fontSize: 13 }}>{fmtBday(e.birthday)} · {du === 0 ? "heute! 🎉" : "in " + du + " Tagen"}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function EditModal({ C, emp, onClose, onSave }) {
  const [name, setName] = useState(emp.name);
  const bParts = emp.birthday ? emp.birthday.split("-") : null;
  const initDate = bParts ? (bParts.length === 3 ? emp.birthday : "2000-" + bParts[0] + "-" + bParts[1]) : "";
  const [bday, setBday] = useState(initDate);
  const [fach, setFach] = useState(emp.fach || "");
  const [azubi, setAzubi] = useState(!!emp.azubi);
  const [schulkinder, setSchulkinder] = useState(!!emp.schulkinder);
  const [pflege, setPflege] = useState(!!emp.pflege);
  const [teilzeit, setTeilzeit] = useState(!!emp.teilzeit);
  const [vollzeit, setVollzeit] = useState(!!emp.vollzeit);
  const inp = { width: "100%", fontSize: 16, padding: "10px 12px", border: `1px solid ${C.line}`, borderRadius: 0, background: "#fff" };
  const lbl = { fontSize: 12, color: C.muted, fontWeight: 600, display: "block", marginBottom: 5 };
  const check = (val, set, label) => (
    <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", padding: "10px 12px", border: `1.5px solid #000`, borderRadius: 0, background: val ? "#f7c6c9" : "#fff" }}>
      <input type="checkbox" checked={val} onChange={(e) => set(e.target.checked)} style={{ width: 18, height: 18, cursor: "pointer" }} />
      <span style={{ fontSize: 15 }}>{label}</span>
    </label>
  );
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: "#fff", borderRadius: 0, padding: 22, width: "100%", maxWidth: 380, maxHeight: "90vh", overflowY: "auto", boxShadow: "0 20px 40px rgba(0,0,0,0.2)" }}>
        <h3 style={{ marginBottom: 14 }}>Bearbeiten</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 18 }}>
          <div>
            <label style={lbl}>Name</label>
            <input value={name} onChange={(e) => setName(e.target.value)} style={inp} autoFocus />
          </div>
          <div>
            <label style={lbl}>Fachbereich</label>
            <select value={fach} onChange={(e) => setFach(e.target.value)} style={inp}>
              <option value="">— kein Fachbereich —</option>
              {FACHBEREICHE.map((f) => (<option key={f} value={f}>{f}</option>))}
            </select>
          </div>
          {check(azubi, setAzubi, "Auszubildende:r")}
          {check(vollzeit, (v) => { setVollzeit(v); if (v) setTeilzeit(false); }, "Vollzeit")}
          {check(teilzeit, (v) => { setTeilzeit(v); if (v) setVollzeit(false); }, "Teilzeit")}
          {check(pflege, setPflege, "Pflegebedürftige Angehörige")}
          {check(schulkinder, setSchulkinder, "Hat schulpflichtige Kinder")}
          <div>
            <label style={lbl}>Geburtstag (Jahr egal)</label>
            <input type="date" value={bday} onChange={(e) => setBday(e.target.value)} style={inp} />
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button onClick={onClose} style={{ border: `1px solid ${C.line}`, background: C.bg, color: C.ink, padding: "11px 16px", borderRadius: 0, fontWeight: 600, cursor: "pointer", fontSize: 15 }}>Abbrechen</button>
          <button
            onClick={() => { let b = ""; if (bday) { const p = bday.split("-"); b = p[1] + "-" + p[2]; } onSave({ ...emp, name: name.trim() || emp.name, birthday: b, fach, azubi, schulkinder, pflege, teilzeit, vollzeit }); }}
            style={{ border: "none", background: C.accent, color: "#fff", padding: "11px 16px", borderRadius: 0, fontWeight: 600, cursor: "pointer", fontSize: 15 }}
          >
            Speichern
          </button>
        </div>
      </div>
    </div>
  );
}

root.render(<App />);
</script>
